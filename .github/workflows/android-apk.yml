name: Build BioTerre SVT APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Restore Firebase config, debug keystore, and env
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -f app/GOOGLE_SERVICES_JSON ]; then
            cp app/GOOGLE_SERVICES_JSON app/google-services.json
          fi
          if [ ! -f app/google-services.json ] && [ -f GOOGLE_SERVICES_JSON ]; then
            cp GOOGLE_SERVICES_JSON app/google-services.json
          fi
          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            {
              echo "### ❌ Fichier app/google-services.json manquant sur GitHub"
              echo "L'APK ne peut pas démarrer Firebase sans \`app/google-services.json\`."
              echo ""
              echo "**Solutions :**"
              echo "1. Téléchargez l'APK directement depuis **Google AI Studio** (menu Paramètres → Générer APK)."
              echo "2. Ou ajoutez le secret \`GOOGLE_SERVICES_JSON\` dans **GitHub → Settings → Secrets and variables → Actions** avec le contenu de \`app/google-services.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ ! -f .env.example ]; then
            touch .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" 2>&1 | tee /tmp/gradle-build.log; then
            echo "### Erreur de compilation Gradle / Kotlin" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(e: |FAILURE:|\\* What went wrong:|> |Caused by:)" /tmp/gradle-build.log | head -n 60 >> "$GITHUB_STEP_SUMMARY" || tail -n 60 /tmp/gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioTerre-SVT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
